  go:
    ecosystem: gomod
    supportedRuntimeVersions: ">=1.23"
    # No zero-code path: compile-time instrumentation (registry entries
    # instrumentation-go-compile-time-*) is not cataloged until validated.
    # Packages are opentelemetry-go-contrib instrumentations and instrumentation
    # maintained by the library's own project (registry isFirstParty or verified
    # repository ownership); community and vendor packages are excluded. All
    # must be wired into application code (activation: manual). Standard-library
    # packages (net/http, database/sql) are not cataloged: go.mod never lists
    # them. Contrib publishes no supported library ranges, and the versions in
    # an instrumentation's go.mod are what minimum version selection raises the
    # app to, not a support floor, so contrib entries omit supportedVersions.
    autoInstrumentationSupported: false
    runtimeMetricsSupported: true
    sdkStability:
      traces: stable
      metrics: stable
      logs: release_candidate
      profiles: none
    packages:
      - name: connectrpc.com/connect
        instrumentationOptions:
          - id: native
            instrumentation: connectrpc.com/otelconnect
            kind: native
            inAutoInstrumentation: false
            activation: manual
      - name: github.com/aws/aws-lambda-go
        instrumentationOptions:
          - id: contrib
            instrumentation: go.opentelemetry.io/contrib/instrumentation/github.com/aws/aws-lambda-go/otellambda
            kind: external
            inAutoInstrumentation: false
            activation: manual
      - name: github.com/aws/aws-sdk-go-v2
        instrumentationOptions:
          - id: contrib
            instrumentation: go.opentelemetry.io/contrib/instrumentation/github.com/aws/aws-sdk-go-v2/otelaws
            kind: external
            inAutoInstrumentation: false
            activation: manual
      - name: github.com/cloudwego/hertz
