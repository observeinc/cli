query DatasetQueryOutput(
  $query: [StageInput!]!
  $params: QueryParams!
  $opalVersion: OpalVersion!
) {
  datasetQueryOutput(
    query: $query
    params: $params
    opalVersion: $opalVersion
  ) {
    queryId
    stageId
    paginatedResults
    resultKind
    resultSchema {
      fieldList {
        name
        type {
          tag
        }
        indexDesc {
          column
          type
        }
      }
    }
    errors {
      message
      text
    }
  }
}
