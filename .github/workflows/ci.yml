name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Test
        env:
          OBSERVE_OPENAPI_SPEC: ${{ secrets.OBSERVE_OPENAPI_SPEC }}
          OBSERVE_GQL_TOKEN: ${{ secrets.OBSERVE_GQL_TOKEN }}
          OBSERVE_GQL_SPEC: ${{ secrets.OBSERVE_GQL_SPEC }}
          PR_FROM_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          if [ -n "$OBSERVE_OPENAPI_SPEC" ] && [ -n "$OBSERVE_GQL_SPEC" ]; then
            bun run test
          elif [ "$PR_FROM_FORK" = "true" ]; then
            echo "Fork PRs do not receive OBSERVE_OPENAPI_SPEC or OBSERVE_GQL_SPEC; skipping live codegen and the full suite."
            exit 0
          else
            echo "OBSERVE_OPENAPI_SPEC and OBSERVE_GQL_SPEC are required; a green test check means bun run test ran."
            exit 1
          fi
