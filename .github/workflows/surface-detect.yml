# Advisory: list the CLI commands a PR adds, changes or removes, so eval
# coverage can be checked. Never blocks the PR.
name: Surface detect

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

# A newer push supersedes an older run, so the sticky comment never goes stale.
concurrency:
  group: surface-detect-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # OIDC + AWS stay in this job only. It never checks out the PR, so untrusted
  # code cannot mint a token or inherit the session. Point the role's trust
  # policy at sub repo:observeinc/cli:pull_request (not repo:…:*) and allow
  # only s3:GetObject on the object named by the COVERAGE_INDEX_S3_URI secret.
  fetch-coverage-index:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    outputs:
      enabled: ${{ steps.cov.outputs.enabled }}
    steps:
      - name: Coverage index config
        id: cov
        env:
          COVERAGE_INDEX_ROLE_ARN: ${{ vars.COVERAGE_INDEX_ROLE_ARN }}
          COVERAGE_INDEX_S3_URI: ${{ secrets.COVERAGE_INDEX_S3_URI }}
        run: |
          if [ -n "$COVERAGE_INDEX_ROLE_ARN" ] && [ -n "$COVERAGE_INDEX_S3_URI" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials
        if: steps.cov.outputs.enabled == 'true'
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.COVERAGE_INDEX_ROLE_ARN }}
          aws-region: us-west-2

      - name: Download coverage index
        if: steps.cov.outputs.enabled == 'true'
        continue-on-error: true
        env:
          COVERAGE_INDEX_S3_URI: ${{ secrets.COVERAGE_INDEX_S3_URI }}
        run: aws s3 cp --quiet "$COVERAGE_INDEX_S3_URI" "$RUNNER_TEMP/coverage-index.json"

      - name: Upload coverage index
        if: steps.cov.outputs.enabled == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: coverage-index
          path: ${{ runner.temp }}/coverage-index.json
          if-no-files-found: ignore
          retention-days: 1

  detect:
    needs: fetch-coverage-index
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Test the detector
        run: bun test scripts/surface-detect.test.ts

      # Loading the real command tree needs codegen, whose spec secrets fork
      # PRs don't get (same as ci.yml), so forks get no report.
      - name: Codegen
        id: codegen
        env:
          OBSERVE_OPENAPI_SPEC: ${{ secrets.OBSERVE_OPENAPI_SPEC }}
          OBSERVE_GQL_TOKEN: ${{ secrets.OBSERVE_GQL_TOKEN }}
          OBSERVE_GQL_SPEC: ${{ secrets.OBSERVE_GQL_SPEC }}
        run: |
          if [ -z "$OBSERVE_OPENAPI_SPEC" ] || [ -z "$OBSERVE_GQL_SPEC" ]; then
            echo "Codegen secrets unavailable (fork PR?); skipping surface detection." >> "$GITHUB_STEP_SUMMARY"
            echo "ran=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bun run codegen
          echo "ran=true" >> "$GITHUB_OUTPUT"

      # Optional private S3 index, fetched by the sibling job. Role ARN is a
      # repo variable; URI is a secret so the bucket name is not in git.
      - name: Download coverage index artifact
        if: steps.codegen.outputs.ran == 'true' && needs.fetch-coverage-index.outputs.enabled == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: coverage-index
          path: ${{ runner.temp }}

      - name: Detect
        if: steps.codegen.outputs.ran == 'true'
        env:
          # The base commit is regenerated from its own sources.
          OBSERVE_OPENAPI_SPEC: ${{ secrets.OBSERVE_OPENAPI_SPEC }}
          OBSERVE_GQL_TOKEN: ${{ secrets.OBSERVE_GQL_TOKEN }}
          OBSERVE_GQL_SPEC: ${{ secrets.OBSERVE_GQL_SPEC }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COV_ENABLED: ${{ needs.fetch-coverage-index.outputs.enabled }}
        run: |
          # Checkout is refs/pull/N/merge; HEAD^1 is the base it was built on.
          # pull_request.base.sha can lag after main moves and pull in other PRs.
          idx=()
          if [ "$COV_ENABLED" = true ]; then
            idx=(--coverage-index "$RUNNER_TEMP/coverage-index.json")
          fi
          bun run scripts/surface-detect.ts --base HEAD^1 --head HEAD \
            --json surface-report.json --markdown "${idx[@]}" > surface-comment.md
          cat surface-comment.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: steps.codegen.outputs.ran == 'true'
        with:
          name: surface-report
          path: surface-report.json

      # Fork PRs get a read-only token, so they keep the summary and artifact only.
      - name: Comment
        if: github.event_name == 'pull_request' && steps.codegen.outputs.ran == 'true' && github.event.pull_request.head.repo.fork == false
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          marker='<!-- observe-cli-surface-detect -->'
          existing=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq "[.[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\")))][0].id // empty")
          if [ ! -s surface-comment.md ]; then
            # Nothing found now: retire an earlier comment instead of leaving it stale.
            [ -n "$existing" ] && gh api -X PATCH "repos/$REPO/issues/comments/$existing" \
              -f body="$marker"$'\n'"No CLI command surfaces touched in the latest push."
            exit 0
          fi
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F body=@surface-comment.md
          else
            gh api "repos/$REPO/issues/$PR_NUMBER/comments" -F body=@surface-comment.md
          fi

      # The test or detect step failed: say so instead of leaving an old result up.
      - name: Mark comment stale
        if: failure() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          marker='<!-- observe-cli-surface-detect -->'
          body="$marker"$'\n'"Surface detection failed for the latest push, so the earlier result may be stale. See $RUN_URL."
          existing=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq "[.[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\")))][0].id // empty")
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -f body="$body"
          else
            gh api "repos/$REPO/issues/$PR_NUMBER/comments" -f body="$body"
          fi
