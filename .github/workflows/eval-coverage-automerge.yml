# Approve the daily counts PR and turn on native auto-merge so GitHub
# waits for every required check. Never checks out the PR head.
name: Auto-merge eval coverage

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths: [scripts/eval-coverage.json]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >
      github.event.pull_request.user.login == 'observe-ai-automation[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'bot/eval-coverage' &&
      contains(github.event.pull_request.labels.*.name, 'eval-coverage')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      BASE: ${{ github.event.pull_request.base.sha }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - run: |
          files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$SHA" --jq '[.files[].filename] | join(",")')
          if [ "$files" != scripts/eval-coverage.json ]; then echo "skip: $files"; exit 0; fi
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --auto --squash --match-head-commit "$SHA"
          gh pr review "$PR" --repo "$GITHUB_REPOSITORY" --approve
