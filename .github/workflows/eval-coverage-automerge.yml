# Enable native auto-merge as the coverage App so the squash onto main
# can start push workflows. Approve with GITHUB_TOKEN; the App opened
# the PR and cannot approve it. Never checks out the PR head.
name: Auto-merge eval coverage

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths: [scripts/eval-coverage.json]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >
      github.event.pull_request.user.login == 'observe-ai-automation[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'bot/eval-coverage' &&
      contains(github.event.pull_request.labels.*.name, 'eval-coverage')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      BASE: ${{ github.event.pull_request.base.sha }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - id: gate
        run: |
          files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$SHA" --jq '[.files[].filename] | join(",")')
          if [ "$files" != scripts/eval-coverage.json ]; then
            echo "skip: $files"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - uses: actions/create-github-app-token@v2
        if: steps.gate.outputs.skip != 'true'
        id: app-token
        with:
          app-id: ${{ vars.CLI_COVERAGE_APP_ID }}
          private-key: ${{ secrets.CLI_COVERAGE_APP_PRIVATE_KEY }}
      - if: steps.gate.outputs.skip != 'true'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          GH_TOKEN="$APP_TOKEN" gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --auto --squash --match-head-commit "$SHA"
          gh pr review "$PR" --repo "$GITHUB_REPOSITORY" --approve
