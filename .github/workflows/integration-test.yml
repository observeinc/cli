name: integration-test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 17 * * *" # 10am PT

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    concurrency:
      group: integration-tests-${{ github.ref }}
    timeout-minutes: 60
    outputs:
      failed_tests: ${{ steps.failed_tests.outputs.failed_tests }}
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "^1.4.4"

      - run: bun install --frozen-lockfile

      - name: Require integration secrets
        id: secrets
        env:
          OBSERVE_OPENAPI_SPEC: ${{ secrets.OBSERVE_OPENAPI_SPEC }}
          OBSERVE_INTEGRATION_API_TOKEN: ${{ secrets.OBSERVE_INTEGRATION_API_TOKEN }}
          PR_FROM_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          if [ -n "$OBSERVE_INTEGRATION_API_TOKEN" ] && [ -n "$OBSERVE_OPENAPI_SPEC" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif [ "$PR_FROM_FORK" = "true" ]; then
            echo "::warning::Fork PRs do not receive OBSERVE_INTEGRATION_API_TOKEN or OBSERVE_OPENAPI_SPEC; skipping live codegen and the integration suite."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          else
            echo "::error::OBSERVE_INTEGRATION_API_TOKEN and OBSERVE_OPENAPI_SPEC are required on non-fork runs; configure those secrets and the job will not pass without them."
            exit 1
          fi

      - name: Codegen
        if: steps.secrets.outputs.available == 'true'
        run: bun run ifneeded:codegen
        env:
          OBSERVE_OPENAPI_SPEC: ${{ secrets.OBSERVE_OPENAPI_SPEC }}
          OBSERVE_GQL_TOKEN: ${{ secrets.OBSERVE_GQL_TOKEN }}
          OBSERVE_GQL_SPEC: ${{ secrets.OBSERVE_GQL_SPEC }}

      - name: Integration tests
        if: steps.secrets.outputs.available == 'true'
        id: tests
        run: bun run test:integration --reporter=junit --reporter-outfile=junit.xml
        env:
          CI: "true"
          OBSERVE_INTEGRATION_CUSTOMER: ${{ vars.OBSERVE_INTEGRATION_CUSTOMER }}
          OBSERVE_INTEGRATION_DOMAIN: ${{ vars.OBSERVE_INTEGRATION_DOMAIN }}
          OBSERVE_INTEGRATION_API_TOKEN: ${{ secrets.OBSERVE_INTEGRATION_API_TOKEN }}

      - name: Collect failing tests
        id: failed_tests
        if: failure() && steps.tests.outcome == 'failure'
        run: |
          {
            echo "failed_tests<<__EOF__"
            bun run scripts/failed-tests-preview.ts junit.xml 5
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

  # Decides whether inbound-share runs. Kept out of that job so pull requests
  # that skip it never take a place in its concurrency group.
  inbound-share-scope:
    name: inbound-share scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Decide whether this change needs the test
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_FROM_FORK: ${{ github.event.pull_request.head.repo.fork }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$PR_FROM_FORK" = "true" ]; then
            echo "Fork PRs do not receive the integration secrets; skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed_files=$(git diff --name-only "$BASE_SHA" HEAD)
          if grep -qE '^(src/commands/inbound-share/|src/rest/inbound-share/|integration/inbound-share-registered\.test\.ts$|\.github/workflows/integration-test\.yml$)' <<< "$changed_files"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No inbound-share changes; skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  # Uses one long-lived Snowflake share on the integration tenant. Runs one at a
  # time across all refs, since two runs tracking the same table would share
  # one tracked-table record. A newer queued run replaces a pending one, so
  # notify also reports a run cancelled on main.
  inbound-share:
    name: inbound-share with a registered share
    needs: inbound-share-scope
    if: needs.inbound-share-scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: integration-tests-inbound-share
      cancel-in-progress: false
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "^1.4.4"

      - run: bun install --frozen-lockfile

      - name: Codegen
        run: bun run ifneeded:codegen
        env:
          OBSERVE_OPENAPI_SPEC: ${{ secrets.OBSERVE_OPENAPI_SPEC }}
          OBSERVE_GQL_TOKEN: ${{ secrets.OBSERVE_GQL_TOKEN }}
          OBSERVE_GQL_SPEC: ${{ secrets.OBSERVE_GQL_SPEC }}

      - name: Integration test
        run: bun test integration/inbound-share-registered.test.ts
        env:
          CI: "true"
          OBSERVE_INTEGRATION_CUSTOMER: ${{ vars.OBSERVE_INTEGRATION_CUSTOMER }}
          OBSERVE_INTEGRATION_DOMAIN: ${{ vars.OBSERVE_INTEGRATION_DOMAIN }}
          OBSERVE_INTEGRATION_API_TOKEN: ${{ secrets.OBSERVE_INTEGRATION_API_TOKEN }}
          OBSERVE_INTEGRATION_SHARE_NAME: ${{ vars.OBSERVE_INTEGRATION_SHARE_NAME }}
          OBSERVE_INTEGRATION_SHARE_PROVIDER_ACCOUNT: ${{ vars.OBSERVE_INTEGRATION_SHARE_PROVIDER_ACCOUNT }}
          OBSERVE_INTEGRATION_SHARE_SCHEMA: ${{ vars.OBSERVE_INTEGRATION_SHARE_SCHEMA }}
          OBSERVE_INTEGRATION_SHARE_TABLE: ${{ vars.OBSERVE_INTEGRATION_SHARE_TABLE }}

  notify:
    name: Notify Slack on failure
    runs-on: ubuntu-latest
    needs: [integration, inbound-share-scope, inbound-share]
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    steps:
      - name: Send Slack alert
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_INTEGRATION_TEST_WEBHOOK_URL }}
          FAILED_TESTS: ${{ needs.integration.outputs.failed_tests }}
          OUTCOME: ${{ contains(needs.*.result, 'failure') && 'failed' || 'were cancelled' }}
        run: |
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fallback="❌ CLI integration tests ${OUTCOME} for ${GITHUB_REPOSITORY} (${GITHUB_REF_NAME}, ${GITHUB_EVENT_NAME}) — ${run_url}"
          payload=$(jq -n \
            --arg fallback "$fallback" \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg ref "$GITHUB_REF_NAME" \
            --arg event "$GITHUB_EVENT_NAME" \
            --arg run_url "$run_url" \
            --arg failed "$FAILED_TESTS" \
            --arg outcome "$OUTCOME" '
            {
              text: $fallback,
              blocks: (
                [
                  { type: "header", text: { type: "plain_text", text: ("❌ CLI integration tests " + $outcome), emoji: true } },
                  { type: "context", elements: [
                      { type: "mrkdwn", text: ("*\($repo)*  ·  `\($ref)`  ·  \($event)") }
                  ] }
                ]
                + (if ($failed | gsub("\\s"; "")) != "" then
                    [ { type: "section", text: { type: "mrkdwn", text: ("*Failing tests:*\n```\n\($failed)\n```") } } ]
                   else [] end)
                + [
                  { type: "actions", elements: [
                      { type: "button", text: { type: "plain_text", text: "View run", emoji: true }, url: $run_url }
                  ] }
                ]
              )
            }')
          curl -sf -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"
